<style>
/* Layout: phone-first single column. Sticky top bar, one scrolling view, bottom tab bar. The graph becomes a pocket family tree around one figure at a time. */
:root{
  --bg:#EDEEE9; --surface:#F8F8F4; --surface-2:#E3E5DE; --ink:#1C2330; --ink-2:#4A5262; --line:#C9CCC2;
  --accent:#2B4C8C; --accent-ink:#FFFFFF;
  --r-void:#5B5F66; --r-olympus:#A67A08; --r-under:#5B2A86; --r-earth:#3B7A37; --r-cretetroy:#12807A; --r-sea:#1F5FA8;
  --e-birth:#7A8190; --e-single:#D98300; --e-trans:#C0392B; --e-anchor:#7D8491; --e-alt:#8E6CC4;
  --good:#2E7D4F; --bad:#B03A2E;
  --f-display:"Marcellus","Palatino Linotype",Palatino,Georgia,serif;
  --f-body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 8px 24px rgba(20,28,45,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131C; --surface:#151C28; --surface-2:#1D2634; --ink:#E6E8EC; --ink-2:#A3ABB9; --line:#2C3748;
  --accent:#7FA2E8; --accent-ink:#0E131C;
  --r-void:#9AA0A8; --r-olympus:#E0B84A; --r-under:#A57BD6; --r-earth:#72B66A; --r-cretetroy:#3FBFB5; --r-sea:#5B9BE6;
  --e-birth:#7C8697; --e-single:#F2A93B; --e-trans:#EF6B5E; --e-anchor:#8B93A1; --e-alt:#B79AF0;
  --good:#5CC48A; --bad:#EF6B5E; --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131C; --surface:#151C28; --surface-2:#1D2634; --ink:#E6E8EC; --ink-2:#A3ABB9; --line:#2C3748;
  --accent:#7FA2E8; --accent-ink:#0E131C;
  --r-void:#9AA0A8; --r-olympus:#E0B84A; --r-under:#A57BD6; --r-earth:#72B66A; --r-cretetroy:#3FBFB5; --r-sea:#5B9BE6;
  --e-birth:#7C8697; --e-single:#F2A93B; --e-trans:#EF6B5E; --e-anchor:#8B93A1; --e-alt:#B79AF0;
  --good:#5CC48A; --bad:#EF6B5E; --shadow:0 8px 24px rgba(0,0,0,.5); color-scheme:dark}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:720px;margin:0 auto;background:var(--bg)}
/* top bar */
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line);min-height:56px}
.bar h1{flex:1;min-width:0;margin:0;font:400 19px/1.2 var(--f-display);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.ib{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:active{background:var(--surface-2)}
.ib svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.3}
/* scrolling view */
.views{overflow:auto;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tabbar button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-2);cursor:pointer;min-height:56px}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent);font-weight:700}
/* trail */
.trail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.trail::-webkit-scrollbar{display:none}
.trail button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.trail button.cur{color:var(--ink);border-color:var(--accent)}
/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--rc)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font:12.5px var(--f-mono);color:var(--ink-2);align-items:center}
.meta .rg{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.hero h2{font:400 34px/1.08 var(--f-display);margin:8px 0 2px;text-wrap:balance;overflow-wrap:anywhere}
.hero .roman{color:var(--ink-2);font-style:italic}
.hero p{margin:10px 0 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:500;text-align:center}
.btn:active{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card h3{font:500 11.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card p{margin:0}
.card + .card{margin-top:0}
.tree{width:100%;display:block;touch-action:manipulation}
.tree text{font-family:var(--f-body)}
.tree g[data-go]{cursor:pointer}
.tree-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:36px}
.switch input{accent-color:var(--accent);width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:15px;max-width:100%}
.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:active{border-color:var(--accent)}
.row-note{font-size:14.5px;margin:4px 0 10px;color:var(--ink-2)}
.origin{display:flex;gap:12px;align-items:flex-start}
.origin svg{flex:none;margin-top:9px}
.alt{display:grid;gap:10px}
.alt .src,.srcs{font:12.5px/1.5 var(--f-mono);color:var(--ink-2)}
.srcs ul{margin:0;padding-left:18px}
.riddle{font-style:italic;font-size:17px}
.ans{font-style:normal;font-weight:700;margin-top:8px}
.sx{font-family:"Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols2",sans-serif;font-variant-emoji:text;color:var(--ink-2);font-weight:400}
.more{border:0;background:none;color:var(--accent);padding:4px 0;cursor:pointer;font:inherit;font-size:14px}
/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.li:last-child{border-bottom:0}
.li:active{background:var(--surface-2)}
.li .nm{flex:1;min-width:0}
.li .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .nm small{display:block;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .k{font:12px var(--f-mono);color:var(--ink-2);flex:none;text-align:right}
.genhead{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 2px 6px;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between}
.filters{display:flex;flex-direction:column;gap:10px;position:sticky;top:-14px;z-index:3;background:var(--bg);padding:14px 0 8px;margin-top:-14px}
.hscroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}
.chip[aria-pressed="false"]{opacity:.45}
.input{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
select.input{padding:8px 12px}
/* descendants tree list */
.desc details{margin-left:14px;border-left:1px solid var(--line);padding-left:6px}
.desc>details{margin-left:0;border-left:0;padding-left:0}
.desc summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.desc summary::-webkit-details-marker{display:none}
.desc summary .tw{width:22px;text-align:center;color:var(--ink-2);flex:none;transition:transform .15s}
.desc details[open]>summary .tw{transform:rotate(90deg)}
.desc .leaf{display:flex;align-items:center;gap:8px;min-height:44px;margin-left:14px;padding-left:6px;border-left:1px solid var(--line)}
.desc .leaf .tw{width:22px;flex:none}
.desc>.leaf{margin-left:0;border-left:0;padding-left:0}
.namebtn{border:0;background:none;padding:6px 0;text-align:left;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-width:0}
.namebtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font:12px var(--f-mono);color:var(--ink-2)}
/* chain */
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.chain li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.chain .rail{display:flex;flex-direction:column;align-items:center;align-self:stretch}
.chain .rail i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);margin-top:14px;flex:none}
.chain .rail b{flex:1;width:2px;background:var(--line)}
.chain li:last-child .rail b{display:none}
.chain .rel{font-size:13px;color:var(--ink-2);margin-top:-4px;padding-bottom:6px}
/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .bar{border-bottom:1px solid var(--line)}
.sheet .bar input{flex:1;min-width:0;border:0;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:17px;min-height:44px}
.sheet .body{overflow:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
/* quiz */
.qk{font:12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.qq{font:400 23px/1.3 var(--f-display);margin:8px 0 14px;text-wrap:balance}
.opts{display:grid;gap:9px}
.opt{min-height:52px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;cursor:pointer}
.opt.right{border-color:var(--good);box-shadow:inset 5px 0 0 var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 5px 0 0 var(--bad)}
.score{font:13px var(--f-mono);color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:500 22px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font:12px var(--f-mono);border:1px solid var(--good);color:var(--good);margin:2px 4px 2px 0}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.legend{display:grid;gap:10px;font-size:14.5px}
.legend div{display:flex;gap:12px;align-items:center}
.legend svg{flex:none}
.work summary{list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:48px;cursor:pointer;padding:4px 0;border-bottom:1px solid var(--line)}
.work summary::-webkit-details-marker{display:none}
.work summary b{font:400 17px var(--f-display)}
.work .chips{padding:10px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:721px){ body{background:var(--surface-2)} .app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>

<script>

heogony 270–336","grp":"gorgons","parents":["phorcys","ceto"],"trans":[{"id":"athena","note":"Ovid, Metamorphoses 4.790–803: transformed from a beautiful maiden after Poseidon violated her in Athena's temple"}],"myth":"In Hesiod, Medusa was always a Gorgon. Ovid tells a later version in which she was a beautiful girl whose hair Athena turned to snakes after Poseidon violated her in Athena's temple. Perseus cut off her head while watching her reflection in his shield; Pegasus and Chrysaor sprang from her neck, and Athena set the head on her aegis.","riddles":[{"q":"A goddess turned my hair to serpents; a hero watching my reflection took my head, and a winged horse sprang from my neck.","a":"Medusa"}],"sex":"f","gen":3,"kids":["pegasus","chrysaor"],"notable":true,"origin_kind":"union"},{"id":"echidna","name":"Echidna","desc":"Half woman, half serpent; \"mother of all monsters\".","type":"monster","region":"sea","roman":"Echidna","src":"Hesiod, Theogony 270–336","parents":["phorcys","ceto"],"alt":[{"parents":["chrysaor","callirrhoe"],"src":"Hesiod, Theogony 295–297 (the antecedent is ambiguous)"},{"parents":["tartarus","gaia"],"src":"Apollodorus, Bibliotheca 2.1.2"}],"myth":"With Typhon she bore Orthrus, Cerberus, the Hydra and the Chimera. Argus Panoptes killed her while she slept.","riddles":[{"q":"Half nymph, half speckled snake, I bore the watchdogs of the underworld and of Geryon's cattle.","a":"Echidna"}],"sex":"f","gen":3,"kids":["orthrus","cerberus","hydra","chimera","sphinx","nemean_lion","caucasian_eagle","crommyonian_sow","colchian_dragon","scythes"],"notable":true,"origin_kind":"union"},{"id":"ladon","name":"Ladon","desc":"The serpent that coiled around the tree of the golden apples.","type":"monster","region":"sea","src":"Hesiod, Theogony 270–336; Theogony 333–336","parents":["phorcys","ceto"],"alt":[{"parents":["typhon","echidna"],"src":"Apollodorus, Bibliotheca 2.5.11"}],"sex":"m","gen":3,"kids":[],"notable":false,"origin_kind":"union"},{"id":"thoosa","name":"Thoosa","desc":"Sea nymph; mother of the Cyclops Polyphemus by Poseidon.","type":"nymph","region":"sea","src":"Homer, Odyssey 1.71–73","parents":["phorcys","ceto"],"sex":"f","gen":3,"kids":["polyphemus"],"notable":true,"origin_kind":"union"},{"id":"crataeis","name":"Crataeis","desc":"Sea goddess named by Homer as the mother of Scylla.","type":"nymph","region":"sea","src":"Homer, Odyssey 12.124–126","parents":[],"anchor":[{"id":"phorcys","note":"named as Scylla's mother alongside Phorcys (Apollodorus, Epitome 7.20)"}],"sex":"f","gen":2,"kids":["scylla"],"notable":true,"origin_kind":"anchor"},{"id":"scylla","name":"Scylla","desc":"Six-headed sea monster in the strait opposite Charybdis.","type":"monster","region":"sea","roman":"Scylla","src":"Hesiod, Theogony 270–336","parents":["phorcys","crataeis"],"alt":[{"parents":["typhon","echidna"],"src":"Hyginus, Fabulae 125, 151"}],"trans":[{"id":"circe","note":"Ovid, Metamorphoses 14.1–74: Circe poisoned her bathing pool out of jealousy over Glaucus"}],"myth":"Homer's Scylla has twelve feet and six long necks, each head taking a sailor from a passing ship. Ovid tells that she was once a lovely nymph; the sea god Glaucus loved her, and Circe, who wanted Glaucus, poisoned her pool so that dogs sprouted from her waist.","riddles":[{"q":"From a cliff with six long necks I plucked six sailors from the ship that steered away from the whirlpool.","a":"Scylla"}],"sex":"f","gen":3,"kids":[],"notable":true,"origin_kind":"union"},{"id":"charybdis","name":"Charybdis","desc":"Whirlpool monster that swallows the sea three times a day.","type":"monster","region":"sea","roman":"Charybdis","src":"Homer, Odyssey 12.101–110, 12.426–446; Servius on Aeneid 3.420","parents":["poseidon","gaia"],"trans":[{"id":"zeus","note":"struck by Zeus's thunderbolt into the sea for stealing Heracles' cattle (Servius on Aeneid 3.420)"}],"riddles":[{"q":"Three times a day I swallow the black water, and three times I spit it back.","a":"Charybdis"}],"sex":"f","gen":4,"kids":[],"notable":true,"origin_kind":"union"},{"id":"sirens","name":"Sirens","desc":"Singing bird-women whose song lures sailors to their deaths.","type":"monster","region":"sea","roman":"Sirenes","src":"Apollodorus, Bibliotheca 1.3.4, Epitome 7.18–19; Homer, Odyssey 12.39–54, 12.165–200","parents":["achelous","melpomene"],"alt":[{"parents":["achelous","terpsichore"],"src":"Apollonius Rhodius, Argonautica 4.895–896"},{"parents":["phorcys"],"src":"Sophocles, as reported by Plutarch, Table Talk 9.14"}],"trans":[{"id":"demeter","note":"Ovid, Metamorphoses 5.551–563: given bird bodies to search for Persephone"}],"myth":"Odysseus had his crew plug their ears with wax and tie him to the mast so he could hear the Sirens and live. The Argonauts passed them because Orpheus sang louder.","riddles":[{"q":"We sing of all that happens on the earth; wax and a mast rope carried one man safely past.","a":"Sirens"}],"sex":"f","gen":5,"kids":[],"notable":true,"origin_kind":"union"},{"id":"parthenope","name":"Parthenope","desc":"A Siren whose body washed ashore at Naples.","type":"monster","region":"sea","src":"Strabo, Geography 5.4.7","grp":"sirens","parents":["achelous","melpomene"],"sex":"f","gen":5,"kids":[],"notable":false,"origin_kind":"union"},{"id":"ligeia","name":"Ligeia","desc":"A Siren, \"clear-voiced\".","type":"monster","region":"sea","src":"Lycophron, Alexandra 726; Strabo 6.1.1","grp":"sirens","parents":["achelous","melpomene"],"sex":"f","gen":5,"kids":[],"notable":false,"origin_kind":"union"},{"id":"leucosia","name":"Leucosia","desc":"A Siren, \"white one\".","type":"monster","region":"sea","src":"Strabo, Geography 6.1.1","grp":"sirens","parents":["achelous","melpomene"],"sex":"f","gen":5,"kids":[],"notable":false,"origin_kind":"union"},{"id":"typhon","name":"Typhon","desc":"The storm-giant with a hundred snake heads; Zeus's greatest challenger.","type":"giant","region":"void","roman":"Typhoeus","src":"Hesiod, Theogony 820–880; Apollodorus, Bibliotheca 1.6.3","parents":["tartarus","gaia"],"alt":[{"parents":["hera"],"src":"Homeric Hymn to Apollo 305–355 (born of Hera alone)"}],"myth":"Gaia bore Typhon after the Titans fell. In Apollodorus he cut out Zeus's sinews and hid them in a cave; Hermes and Aegipan stole them back, and Zeus buried Typhon under Mount Etna, whose eruptions are his breath.","riddles":[{"q":"A hundred snake heads rose from my shoulders; I was buried beneath the burning mountain of Sicily.","a":"Typhon"}],"sex":"m","gen":1,"kids":["orthrus","cerberus","hydra","chimera","sphinx","caucasian_eagle","crommyonian_sow","colchian_dragon"],"notable":true,"origin_kind":"union"},{"id":"orthrus","name":"Orthrus","desc":"Two-headed dog who guarded Geryon's red cattle.","type":"monster","region":"earth","roman":"Orthus","src":"Hesiod, Theogony 270–336; Apollodorus, Bibliotheca 2.5.10","parents":["typhon","echidna"],"sex":"m","gen":4,"kids":["nemean_lion"],"notable":true,"origin_kind":"union"},{"id":"cerberus","name":"Cerberus","desc":"Many-headed hound who guards the gate of the underworld.","type":"monster","region":"under","roman":"Cerberus","src":"Hesiod, Theogony 310–312, 769–774; Apollodorus, Bibliotheca 2.5.12","parents":["typhon","echidna"],"myth":"Hesiod gives him fifty heads; later writers settle on three. Heracles' twelfth labour was to bring him up from the underworld without weapons. Orpheus lulled him with music, and the Sibyl drugged him with a honey-cake for Aeneas.","riddles":[{"q":"I fawn on those who enter and devour those who try to leave; a lyre and a honey-cake have put me to sleep.","a":"Cerberus"}],"sex":"m","gen":4,"kids":[],"notable":true,"origin_kind":"union"},{"id":"hydra","name":"Lernaean Hydra","desc":"Many-headed water serpent of Lerna; two heads grew for each one cut.","type":"monster","region":"earth","roman":"Hydra","src":"Hesiod, Theogony 313–318; Apollodorus, Bibliotheca 2.5.2","parents":["typhon","echidna"],"myth":"Heracles fought the Hydra for his second labour; his nephew Iolaus seared each stump with fire so no new heads could grow. Heracles dipped his arrows in her venom, which later killed Nessus and, through Nessus's blood, Heracles himself.","riddles":[{"q":"Cut off one of my heads and two grow back; only fire on each stump stopped me.","a":"Lernaean Hydra"}],"sex":"f","gen":4,"kids":[],"notable":true,"origin_kind":"union"},{"id":"chimera","name":"Chimera","desc":"Fire-breathing lion with a goat's head and a serpent tail.","type":"monster","region":"earth","roman":"Chimaera","src":"Hesiod, Theogony 319–325; Homer, Iliad 6.179–182; Apollodorus, Bibliotheca 2.3.1","parents":["typhon","echidna"],"alt":[{"parents":["hydra"],"src":"Hesiod, Theogony 319 (the pronoun may refer to the Hydra)"}],"myth":"Bellerophon rode Pegasus above the Chimera and killed it with arrows, or with a lead-tipped spear that melted in its fiery breath.","riddles":[{"q":"Lion in front, snake behind, goat in the middle, breathing fire; a rider on a winged horse struck me from above.","a":"Chimera"}],"sex":"f","gen":4,"kids":[],"notable":true,"origin_kind":"union"},{"id":"sphinx","name":"Sphinx","desc":"Winged lion with a woman's head who set a riddle for the Thebans.","type":"monster","region":"earth","roman":"Sphinx","src":"Apollodorus, Bibliotheca 3.5.8; Sophocles, Oedipus Tyrannus 391–398","parents":["typhon","echidna"],"alt":[{"parents":["orthrus","echidna"],"src":"Hesiod, Theogony 326–327"}],"myth":"Hera sent the Sphinx to Thebes. She asked travellers what goes on four feet, then two, then three, and devoured those who failed. When Oedipus answered \"man\", she threw herself from the rock.","riddles":[{"q":"What walks on four feet in the morning, two at noon and three in the evening?","a":"A human being (Oedipus's answer to the Sphinx)"}],"sex":"f","gen":4,"kids":[],"notable":true,"origin_kind":"union"},{"id":"nemean_lion","name":"Nemean Lion","desc":"Lion whose golden hide no weapon could pierce.","type":"monster","region":"earth","roman":"Leo Nemeus","src able":true,"origin_kind":"union"},{"id":"philonoe","name":"Philonoe","desc":"Daughter of Iobates; wife of Bellerophon.","type":"mortal","region":"earth","house":"Lycia","src":"Apollodorus, Bibliotheca 2.3.2","parents":["iobates"],"sex":"f","gen":16,"kids":["hippolochus","isander","laodamia"],"notable":true,"origin_kind":"single"},{"id":"hippolochus","name":"Hippolochus","desc":"Son of Bellerophon; father of Glaucus of Lycia.","type":"mortal","region":"earth","house":"Lycia","src":"Homer, Iliad 6.196–206","parents":["bellerophon","philonoe"],"sex":"m","gen":17,"kids":["glaucus_l"],"notable":true,"origin_kind":"union"},{"id":"isander","name":"Isander","desc":"Son of Bellerophon killed by Ares in battle.","type":"mortal","region":"earth","house":"Lycia","src":"Homer, Iliad 6.197, 6.203–204","parents":["bellerophon","philonoe"],"sex":"m","gen":17,"kids":[],"notable":false,"origin_kind":"union"},{"id":"laodamia","name":"Laodamia","desc":"Daughter of Bellerophon; mother of Sarpedon by Zeus, killed by Artemis.","type":"mortal","region":"earth","house":"Lycia","src":"Homer, Iliad 6.197–205","parents":["bellerophon","philonoe"],"wiki":"Laodamia (daughter of Bellerophon)","sex":"f","gen":17,"kids":["sarpedon"],"notable":true,"origin_kind":"union"},{"id":"pegasus","name":"Pegasus","desc":"Winged horse that sprang from Medusa's neck; he struck the spring Hippocrene and became a constellation.","type":"creature","region":"olympus","roman":"Pegasus","house":"Aeolids","src":"Hesiod, Theogony 280–286; Pindar, Olympian 13.63–92","parents":["poseidon","medusa"],"origin":"sprang from Medusa's severed neck","myth":"A stamp of Pegasus's hoof on Mount Helicon opened the spring Hippocrene, sacred to the Muses. After throwing Bellerophon, he carried Zeus's thunderbolts.","riddles":[{"q":"I leapt from a Gorgon's neck; my hoof struck the Muses' spring on Helicon.","a":"Pegasus"}],"sex":"m","gen":4,"kids":[],"notable":true,"origin_kind":"union"},{"id":"chrysaor","name":"Chrysaor","desc":"\"Go nts on an oak tree into my people.","a":"Aeacus"}],"sex":"m","gen":6,"kids":["peleus","telamon","phocus"],"notable":true,"origin_kind":"union"},{"id":"myrmidons","name":"Myrmidons","desc":"People of Aegina (later Phthia) made from ants; the soldiers of Achilles.","type":"creature","region":"earth","roman":"Myrmidones","house":"Aeacids","src":"Ovid, Metamorphoses 7.614–660; Hesiodic Catalogue fr. 205","parents":[],"trans":[{"id":"zeus","note":"ants turned into men at Aeacus's prayer"}],"anchor":[{"id":"aeacus","note":"subjects of Aeacus and his descendants"}],"sex":"x","gen":6,"kids":[],"notable":true,"origin_kind":"transform"},{"id":"endeis","name":"Endeis","desc":"Wife of Aeacus; mother of Peleus and Telamon.","type":"mortal","region":"earth","house":"Aeacids","src":"Apollodorus, Bibliotheca 3.12.6","parents":["sciron"],"alt":[{"parents":["chiron","chariclo"],"src":"Hyginus / scholia on Pindar"}],"sex":"f","gen":8,"kids":["peleus","telamon"],"notable":true,"origin_kind":"single"},{"id":"peleus","name":"Peleus","desc":"Argonaut who wrestled the shape-shifting Thetis into marriage; father of Achilles.","type":"mortal","region":"earth","roman":"Peleus","house":"Aeacids","src":"Apollodorus, Bibliotheca 3.12.6–3.13.8; Ovid, Metamorphoses 11.221–265; Catullus 64","parents":["aeacus","endeis"],"myth":"Peleus and Telamon killed their half-brother Phocus in a game of discus and were exiled. Peleus held Thetis through all her transformations, and all the gods came to their wedding, where Eris threw the golden apple.","riddles":[{"q":"I held a sea goddess through fire, water and lion until she agreed to be my wife; the gods came to the wedding.","a":"Peleus"}],"sex":"m","gen":9,"kids":["polydora_d","achilles"],"notable":true,"origin_kind":"union"},{"id":"telamon","name":"Telamon","desc":"Argonaut who sacked Troy with Heracles; father of the great Ajax and Teucer.","type":"mortal","region":"earth","roman":"Telamon","house":"Aeacids","src":"Apollodorus, Bibliotheca 2.6.4, 3.12.6–7","parents":["aeacus","endeis"],"sex":"m","gen":9,"kids":["ajax","teucer"],"notable":true,"origin_kind":"union"},{"id":"phocus","name":"Phocus","desc":"Half-brother killed by Peleus and Telamon; eponym of Phocis.","type":"mortal","region":"earth","house":"Aeacids","src":"Hesiod, Theogony 1003–1005; Apollodorus, Bibliotheca 3.12.6","parents":["aeacus","psamathe"],"wiki":"Phocus (son of Aeacus)","sex":"m","gen":7,"kids":["crisus","panopeus"],"notable":true,"origin_kind":"union"},{"id":"achilles","name":"Achilles","desc":"Greatest Greek warrior at Troy; invulnerable except for his heel.","type":"demigod","region":"earth","roman":"Achilles","house":"Aeacids","src":"Homer, Iliad; Apollodorus, Bibliotheca 3.13.6–8, Epitome 3–5; Statius, Achilleid","parents":["peleus","thetis"],"myth":"Thetis dipped him in the Styx holding him by the heel. Hidden among the daughters of Lycomedes on Scyros, he was discovered by Odysseus. He withdrew from the fighting after Agamemnon took Briseis, returned to avenge Patroclus by killing Hector, and was killed by Paris's arrow, guided by Apollo, to the heel.","riddles":[{"q":"I chose a short, glorious life over a long obscure one; an arrow to my heel ended it.","a":"Achilles"}],"sex":"m","gen":10,"kids":["neoptolemus"],"notable":true,"origin_kind":"union"},{"id":"deidamia","name":"Deidamia","desc":"Princess of Scyros; mother of Neoptolemus by Achilles.","type":"mortal","region":"earth","house":"Aeacids","src":"Apollodorus, Bibliotheca 3.13.8; Statius, Achilleid","parents":["lycomedes"],"sex":"f","gen":11,"kids":["neoptolemus"],"notable":true,"origin_kind":"single"},{"id":"lycomedes","name":"Lycomedes","desc":"King of Scyros who hid Achilles among his daughters, and later killed Theseus.","type":"mortal","region":"earth","house":"Aeacids","src":"Apollodorus, Bibliotheca 3.13.8, Epitome 1.24","parents":[],"anchor":[{"id":"achilles","note":"Achilles' host and father-in-law"}],"sex":"m","gen":10,"kids":["deidamia"],"notable":true,"origin_kind" (function(){

const TYPES=[["primordial","Primordials"],["titan","Titans"],["olympian","Olympians"],["deity","Other gods"],["spirit","Spirits"],["nymph","Nymphs"],["demigod","Demigods"],["mortal","Mortals"],["giant","Giants"],["monster","Monsters"],["creature","Creatures"]];
const TYPE_ONE={primordial:"Primordial",titan:"Titan",olympian:"Olympian",deity:"God",spirit:"Spirit",nymph:"Nymph",demigod:"Demigod",mortal:"Mortal",giant:"Giant",monster:"Monster",creature:"Creature"};

// ---------- pocket family tree (SVG) ----------
function familySVG(e,W){
  const top=[]; // {id,kind}
  for(const p of e.parents) top.push({id:p,kind:e.parents.length===1?"single":"birth"});
  if(!e.parents.length) for(const a of e.anchor||[]) top.push({id:a.id,kind:"anchor"});
  for(const t of (e.trans||[]).slice(0,2)) top.push({id:t.id,kind:"trans"});
  if(showAlt) for(const a of e.alt||[]) for(const p of a.parents) if(!top.some(x=>x.id===p)) top.push({id:p,kind:"alt"});
  const rank=k=>{const n=E.get(k);return n.type==="olympian"?0:n.myth?1:n.notable?2:3};
  const kids=e.kids.slice().sort((a,b)=>rank(a)-rank(b));
  const cols=W<340?2:3, maxKids=cols*3;
  const shown=kids.slice(0, kids.length>maxKids?maxKids-1:maxKids);
  const extra=kids.length-shown.length;
  const gap=8, nh=42;
  const topCols=Math.min(Math.max(top.length,1),cols+ (W>=400?1:0));

  const tw=(W-gap*(topCols+1))/topCols, cw=(W-gap*(cols+1))/cols;
  const yTop=6, yFocus=yTop+(rowsTop?rowsTop*(nh+gap)+34:0), fh=52, yKids=yFocus+fh+40;
  const kidCount=shown.length+(extra?1:0), rowsK=Math.ceil(kidCount/cols);
  const H=(kidCount?yKids+rowsK*(nh+gap):yFocus+fh+6)+2;
  const fw=Math.min(W-40,260), fx=(W-fw)/2;
  const charW=7.1, trunc=(s,w)=>{const n=Math.floor((w-24)/charW);return s.length>n?s.slice(0,Math.max(3,n-1))+"…":s};
  let edges="", nodes="";
  const node=(id,x,y,w,h,opts={})=>{ const n=E.get(id), rc=C.r[n.region];
    const fill=mix(C.surface,rc,opts.focus?.28:.16);
    return `<g ${opts.focus?"":`data-go="${id}" role="link" tabindex="0" aria-label="${esc(n.name)}"`}>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${opts.focus?12:9}" fill="${fill}" stroke="${rc}" stroke-width="${opts.focus?2.5:1.4}" ${members.has(id)?'stroke-dasharray="5 3"':""}/>
      <text x="${x+w/2}" y="${y+h/2+ (opts.focus?6:5)}" text-anchor="middle" font-size="${opts.focus?19:14}" fill="${C.ink}" ${opts.focus?'style="font-family:Marcellus,Georgia,serif"':""}>${SEX[n.sex]} ${esc(trunc(n.name,w-16))}</text></g>`; };
  const style=k=>({birth:`stroke="${C.birth}" stroke-width="1.8"`,single:`stroke="${C.single}" stroke-width="2.4" stroke-dasharray="2 5" stroke-linecap="round"`,
    trans:`stroke="${C.trans}" stroke-width="2" stroke-dasharray="8 5"`,anchor:`stroke="${C.anchor}" stroke-width="1.6" stroke-dasharray="3 3"`,alt:`stroke="${C.alt}" stroke-width="1.6" stroke-dasharray="6 6"`})[k];
  top.forEach((t,i)=>{ const r=Math.floor(i/topCols), c=i%topCols, inRow=Math.min(topCols,top.length-r*topCols);
    const off=(W-(inRow*tw+(inRow-1)*gap))/2; const x=off+c*(tw+gap), y=yTop+r*(nh+gap);
    const sx=x+tw/2, sy=y+nh, ex=W/2+(t.kind==="birth"||t.kind==="single"?(i===0?-18:18)*(e.parents.length>1?1:0):0), ey=yFocus;
    edges+=`<path d="M${sx} ${sy} C ${sx} ${sy+28}, ${ex} ${ey-30}, ${ex} ${ey}" fill="none" ${style(t.kind)}/>`;
    nodes+=node(t.id,x,y,tw,nh); });
  nodes+=node(e.id,fx,yFocus,fw,fh,{focus:true});
  if(kidCount){ const busY=yFocus+fh+20;
    const kidPos=[]; for(let i=0;i<kidCount;i++){ const r=Math.floor(i/cols), c=i%cols, inRow=Math.min(cols,kidCount-r*cols);
      const off=(W-(inRow*cw+(inRow-1)*gap))/2; kidPos.push([off+c*(cw+gap), yKids+r*(nh+gap)]); }
    const firstRow=kidPos.filter(p=>p[1]===yKids); const minX=Math.min(...firstRow.map(p=>p[0]+cw/2)), maxX=Math.max(...firstRow.map(p=>p[0]+cw/2));
    edges+=`<path d="M${W/2} ${yFocus+fh} V ${busY} M ${Math.min(minX,W/2)} ${busY} H ${Math.max(maxX,W/2)}" fill="none" stroke="${C.birth}" stroke-width="1.8"/>`;
    kidPos.forEach(([x,y],i)=>{ if(y===yKids) edges+=`<path d="M${x+cw/2} ${busY} V ${y}" fill="none" stroke="${C.birth}" stroke-width="1.8"/>`;
      if(i<shown.length) nodes+=node(shown[i],x,y,cw,nh);
      else nodes+=`<g data-more="kids" role="button" tabindex="0"><rect x="${x}" y="${y}" width="${cw}" height="${nh}" rx="9" fill="${C.bg}" stroke="${C.line}"/><text x="${x+cw/2}" y="${y+nh/2+5}" text-anchor="middle" font-size="14" fill="${C.accent}">+${extra} more</text></g>`; });
  }
  return `<svg class="tree" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Family of ${esc(e.name)}">${edges}${nodes}</svg>`;
}

// ---------- explore view ----------
function originText(e){
  const P=e.parents.map(p=>E.get(p).name);
  switch(e.origin_kind){
    case "primordial": return "Primordial: came into being with no parents.";
    case "union": return "Born of "+P.join(" and ")+".";
    case "single": return (e.origin?e.origin.charAt(0).toUpperCase()+e.origin.slice(1)+". ":"")+"One mapped parent: "+P[0]+(e.origin?"":" (the other parent is not named in the sources used)")+".";
    case "transform": return "No recorded birth; this figure comes from a transformation or curse.";
    default: return "Parentage not recorded in the main sources. Linked here through "+(e.anchor||[]).map(a=>E.get(a.id).name).join(", ")+".";
  }
}
function section(title,inner,right=""){ return `<div class="card"><h3><span>${title}</span>${right}</h3>${inner}</div>`; }

    <button class="btn" data-panel="desc"${kids.length?"":" disabled style='opacity:.45'"}><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>Descendants</button>
    <button class="btn" data-panel="path"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 8l8 8"/></svg>Connect to…</button>
    <a class="btn" href="${wikiURL(e)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>Wikipedia</a>
  </div>
  ${section("Origin",`<div class="origin">${lineSVG(e.origin_kind)}<p>${esc(originText(e))}</p></div>`)}`;
  if(e.trans&&e.trans.length) h+=section("Transformed or cursed by",e.trans.map(t=>`<div style="margin-bottom:10px">${chipBtn(t.id)}<p class="row-note" style="margin:6px 0 0">${esc(t.note)}</p></div>`).join(""));

function listRow(id,sub){ const e=E.get(id); return `<button class="li" data-go="${id}">${dot(id)}<span class="nm"><b><span class="sx">${SEX[e.sex]}</span> ${esc(e.name)}</b>${sub?`<small>${esc(sub)}</small>`:e.roman?`<small>${esc(e.roman)}</small>`:""}</span><span class="k">${esc(TYPE_ONE[e.type])}<br>G${e.gen}</span></button>`; }
function openPanel(kind){
  const e=E.get(cur); const body=$("#panelBody"); $("#panel").hidden=false; body.scrollTop=0;
  try{ history.pushState({panel:kind,id:cur},"","#"+cur); }catch(err){}
  if(kind==="anc"){
    $("#panelTitle").textContent="Ancestry of "+e.name;
    const seen=new Map(); const q=[[e.id,0]];
    while(q.length){ const [n,d]=q.shift(); for(const p of E.get(n).parents) if(!seen.has(p)){ seen.set(p,d+1); q.push([p,d+1]); } }
    if(!seen.size){ body.innerHTML=`<div class="card"><p>${esc(originText(e))}</p></div>`; return; }
    const byGen=new Map(); for(const [id] of seen){ const g=E.get(id).gen; if(!byGen.has(g)) byGen.set(g,[]); byGen.get(g).push(id); }
    const gens=[...byGen.keys()].sort((a,b)=>a-b);
    body.innerHTML=`<p class="row-note">${seen.size} ancestors through recorded parent links, from the oldest generation down to ${esc(e.name)}'s parents.</p>`+
      gens.map(g=>`<div><div class="genhead"><span>Gen ${g}</span><span>${byGen.get(g).length}</span></div><div class="list">${byGen.get(g).sort((a,b)=>seen.get(a)-seen.get(b)).map(id=>listRow(id,seen.get(id)===1?"Parent":seen.get(id)===2?"Grandparent":`${seen.get(id)} generations up`)).join("")}</div></div>`).join("");

function search(v,limit=30){ v=v.trim().toLowerCase(); if(!v) return [];
  return DATA.filter(e=>(e.name+" "+(e.roman||"")).toLowerCase().includes(v))
    .sort((a,b)=>(a.name.toLowerCase().startsWith(v)?0:1)-(b.name.toLowerCase().startsWith(v)?0:1)||(b.notable-a.notable)||a.name.localeCompare(b.name)).slice(0,limit); }

function showPath(src,dst){
  const adj=new Map(); const add=(a,b,how)=>{ if(!adj.has(a)) adj.set(a,[]); adj.get(a).push([b,how]); };
  for(const e of DATA){ for(const p of e.parents){add(p,e.id,"is a parent of");add(e.id,p,"is a child of")}
    for(const t of e.trans||[]){add(t.id,e.id,"transformed or cursed");add(e.id,t.id,"was transformed or cursed by")}
    for(const a of e.anchor||[]){add(a.id,e.id,"is linked to");add(e.id,a.id,"is linked to")} }
  const prev=new Map([[src,null]]); const q=[src];
  while(q.length){ const n=q.shift(); if(n===dst) break; for(const [m,how] of adj.get(n)||[]) if(!prev.has(m)){prev.set(m,[n,how]);q.push(m)} }
  const out=$("#presults");
  if(!prev.has(dst)){ out.innerHTML=`<p class="row-note">No connection found.</p>`; return; }
  const chain=[]; let c=dst; while(c){ const p=prev.get(c); chain.unshift([c,p?p[1]:null]); c=p?p[0]:null; }
  $("#pq").value=E.get(dst).name;
  out.innerHTML=`<p class="row-note" style="margin-top:12px">${chain.length-1} step${chain.length===2?"":"s"} from ${esc(E.get(src).name)} to ${esc(E.get(dst).name)}:</p>
  <div class="card"><ol class="chain">${chain.map(([id,how],k)=>`<li><span class="rail"><i></i><b></b></span><div>${k?`<div class="rel" style="margin-top:6px">${esc(E.get(chain[k-1][0]).name)} ${esc(how)}</div>`:""}${chipBtn(id)}</div></li>`).join("")}</ol></div>`;
}

// ---------- quiz ----------
const Q={score:0,asked:0,streak:0,best:store.get("best",0),cur:null};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function distinct(correct,pool,n=3){ const out=new Set([correct]); let g=0; while(out.size<n+1&&g++<200) out.add(pick(pool)); return shuffle([...out]); }
function makeQ(){
  const pool=DATA.filter(e=>e.notable);
  for(let t=0;t<60;t++){ const kind=pick(["riddle","riddle","parents","roman","trans","child"]); const e=pick(pool);
    if(kind==="riddle"&&e.riddles){ const r=pick(e.riddles); return {k:"Riddle · who am I?",q:r.q,a:r.a,opts:distinct(r.a,DATA.filter(x=>x.riddles&&x.id!==e.id).map(x=>x.riddles[0].a)),id:e.id}; }
    if(kind==="parents"&&e.parents.length===2){ const nm=x=>x.parents.map(p=>E.get(p).name).join(" & "); const o=DATA.filter(x=>x.parents.length===2&&x.type===e.type&&nm(x)!==nm(e)).map(nm); if(o.length<3) continue;
      return {k:"Lineage",q:`Who are the parents of ${e.name}?`,a:nm(e),opts:distinct(nm(e),o),id:e.id}; }
    if(kind==="roman"&&e.roman&&e.roman!==e.name){ return {k:"Greek to Roman",q:`What did the Romans call ${e.name}?`,a:e.roman,opts:distinct(e.roman,DATA.filter(x=>x.roman&&x.roman!==e.roman&&x.roman!==x.name).map(x=>x.roman)),id:e.id}; }
    if(kind==="trans"&&e.trans){ const a=E.get(e.trans[0].id).name; return {k:"Transformations & curses",q:`Who transformed, cursed or reshaped ${e.name}?`,a,opts:distinct(a,[...transformed.keys()].map(i=>E.get(i).name).filter(n=>n!==a)),id:e.id,why:e.trans[0].note}; }
    const rk=e.kids.filter(k=>!members.has(k)&&!/^(Children|Sons|Crew) of/.test(E.get(k).name));
    if(kind==="child"&&rk.length){ const c=E.get(pick(rk)).name; const not=new Set(e.kids.map(k=>E.get(k).name)); const o=pool.filter(x=>!not.has(x.name)&&x.gen===E.get(rk[0]).gen).map(x=>x.name); if(o.length<3) continue;
      return {k:"Offspring",q:`Which of these is a child of ${e.name}?`,a:c,opts:distinct(c,o),id:e.id}; } }
  return null; }
function renderQuiz(){
  const q=Q.cur||(Q.cur=makeQ());
  $("#v-quiz").innerHTML=`<div class="score"><span>Score ${Q.score}/${Q.asked}</span><span>Streak ${Q.streak} · best ${Q.best}</span></div>
  <div class="card"><div class="qk">${esc(q.k)}</div><div class="qq">${esc(q.q)}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-o="${k}">${esc(o)}</button>`).join("")}</div><div id="qfb"></div></div>

}

  if(o&&!o.disabled){ const ok=q.opts[+o.dataset.o]===q.a; Q.asked++; if(ok){Q.score++;Q.streak++;if(Q.streak>Q.best){Q.best=Q.streak;store.set("best",Q.best)}}else Q.streak=0;
    document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(q.opts[k]===q.a)b.classList.add("right");else if(b===o)b.classList.add("wrong")});

function workOf(s){ const m=s.match(/^(.*?)(?:\s+(?:fr\.|frr\.|praef|preface|s\.v\.|\d|[IVX]+\.\d)|\s*\(|,\s*(?:Book|book)\b|$)/); return ((m?m[1]:s).replace(/[,:;\s]+$/,"").trim())||s; }
